<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>校舎案内 - 縦7枚フォトギャラリー</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #222">
      
      <a-assets>
        <img id="kousha-img" src="IMG_7689.jpeg">
        <img id="pic1" src="pic1.jpg">
        <img id="pic2" src="pic2.jpg">
        <img id="pic3" src="pic3.jpg">
        <img id="pic4" src="pic4.jpg">
        <img id="pic5" src="pic5.jpg">
        <img id="pic6" src="pic6.jpg">
        <img id="pic7" src="pic7.jpg">
      </a-assets>

      <a-sphere 
        src="#kousha-img" 
        radius="80" 
        phi-start="60"
        phi-length="240" 
        material="side: double; shader: flat"
        scale="1 1 -1"
        rotation="0 0 0">
      </a-sphere>

      <a-entity id="info-board-area" rotation="0 180 0" position="0 0 -6">
        
        <a-plane 
          id="base-board"
          width="4" 
          height="8" 
          color="#FFFFFF" 
          material="side: double; opacity: 0.9"
          position="0 1.5 0">
        </a-plane>

        <a-text 
          value="PHOTO GALLERY" 
          align="center" 
          color="#333" 
          width="8" 
          position="0 5 0.1">
        </a-text>

        <a-image src="#pic1" color="#FF5555" width="3" height="0.8" position="0 3.5 0.1"></a-image>
        <a-image src="#pic2" color="#55FF55" width="3" height="0.8" position="0 2.5 0.1"></a-image>
        <a-image src="#pic3" color="#5555FF" width="3" height="0.8" position="0 1.5 0.1"></a-image>
        <a-image src="#pic4" color="#FFFF55" width="3" height="0.8" position="0 0.5 0.1"></a-image>
        <a-image src="#pic5" color="#FF55FF" width="3" height="0.8" position="0 -0.5 0.1"></a-image>
        <a-image src="#pic6" color="#55FFFF" width="3" height="0.8" position="0 -1.5 0.1"></a-image>
        <a-image src="#pic7" color="#FFAA55" width="3" height="0.8" position="0 -2.5 0.1"></a-image>

      </a-entity>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
