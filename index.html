<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>iPhone対応 5枚ギャラリー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #FFFFFF" renderer="antialias: true; colorManagement: true;">

      <a-assets timeout="10000">
        <img id="main-bg" src="IMG_7689.jpeg" crossorigin="anonymous">
        <img id="t2" src="thumb2.jpg" crossorigin="anonymous">
        <img id="t3" src="thumb3.jpg" crossorigin="anonymous">
        <img id="t5" src="thumb5.jpg" crossorigin="anonymous">
        <img id="t6" src="thumb6.jpg" crossorigin="anonymous">
        <img id="t7" src="thumb7.jpg" crossorigin="anonymous">
      </a-assets>

      <a-sphere 
        src="#main-bg" 
        radius="50" 
        phi-length="300"
        material="side: double; shader: flat"
        scale="1 1 -1"
        rotation="0 30 0">
      </a-sphere>

      <a-entity id="photo-column" rotation="0 180 0" position="0 1.6 -4">
        <a-plane src="#t2" width="2" height="1.2" position="0 2.8 0" material="shader: flat"></a-plane>
        <a-plane src="#t3" width="2" height="1.2" position="0 1.4 0" material="shader: flat"></a-plane>
        <a-plane src="#t5" width="2" height="1.2" position="0 0.0 0" material="shader: flat"></a-plane>
        <a-plane src="#t6" width="2" height="1.2" position="0 -1.4 0" material="shader: flat"></a-plane>
        <a-plane src="#t7" width="2" height="1.2" position="0 -2.8 0" material="shader: flat"></a-plane>
      </a-entity>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;" position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
