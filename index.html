<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>240度パノラマビューア - 校舎</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="kousha-img" src="kousha.jpg">
      </a-assets>

      <a-sphere 
        src="#kousha-img" 
        radius="100" 
        phi-start="60"
        phi-length="240" 
        segments-height="64"
        segments-width="64"
        material="side: double; shader: flat"
        scale="1 1 -1"
        rotation="0 -90 0">
      </a-sphere>

      <a-sky color="#222"></a-sky>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
