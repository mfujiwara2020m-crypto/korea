<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>配置テスト - 修正版</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #0000FF">
      
      <a-sphere 
        color="#FFFF00"
        radius="50" 
        material="side: double; shader: flat; opacity: 0.3"
        position="0 0 0">
      </a-sphere>

      <a-entity id="info-board" position="0 1.6 -15">
        <a-plane color="white" width="4" height="10" position="0 0 0"></a-plane>
        
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 4 0.1"></a-box>
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 2.5 0.1"></a-box>
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 1 0.1"></a-box>
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 -0.5 0.1"></a-box>
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 -2 0.1"></a-box>
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 -3.5 0.1"></a-box>
        <a-box color="red" width="3" height="0.8" depth="0.1" position="0 -5 0.1"></a-box>
      </a-entity>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
