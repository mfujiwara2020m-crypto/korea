<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>300度パノラマと白背景のフォトギャラリー</title>
    <meta name="description" content="A-Frameで背景の一部を白くし、写真を縦に並べる">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #FFFFFF">

      <a-assets>
        <img id="main-bg" src="IMG_7689.jpeg">
        <img id="t2" src="thumb2.jpg">
        <img id="t3" src="thumb3.jpg">
        <img id="t5" src="thumb5.jpg">
        <img id="t6" src="thumb6.jpg">
        <img id="t7" src="thumb7.jpg">
        
      </a-assets>

      <a-sphere 
        src="#main-bg" 
        radius="80" 
        phi-length="300"
        material="side: double; shader: flat"
        scale="1 1 -1"
        rotation="0 30 0">
      </a-sphere>

      <a-entity id="photo-column" rotation="0 180 0" position="0 1.6 -8">
        
        <a-plane src="#t2" width="3" height="1.8" position="0 4.5 0" material="shader: flat"></a-plane>
        <a-plane src="#t3" width="3" height="1.8" position="0 3.0 0" material="shader: flat"></a-plane>
        <a-plane src="#t5" width="3" height="1.8" position="0 1.5 0" material="shader: flat"></a-plane>
        <a-plane src="#t6" width="3" height="1.8" position="0 0.0 0" material="shader: flat"></a-plane>
        <a-plane src="#t7" width="3" height="1.8" position="0 -1.5 0" material="shader: flat"></a-plane>
       
        
      </a-entity>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
