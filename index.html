<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>校舎案内 - 確定版配置</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #444">
      
      <a-assets>
        <img id="kousha-img" src="IMG_7689.jpeg">
        <img id="thumb1" src="thumb1.jpg">
        <img id="thumb2" src="thumb2.jpg">
        <img id="thumb3" src="thumb3.jpg">
        <img id="thumb4" src="thumb4.jpg">
        <img id="thumb5" src="thumb5.jpg">
      </a-assets>

      <a-sphere 
        src="#kousha-img" 
        radius="80" 
        phi-start="60"
        phi-length="240" 
        material="side: double; shader: flat"
        scale="1 1 -1"
        rotation="0 0 0">
      </a-sphere>

      <a-entity id="info-panel" rotation="0 180 0">
        
        <a-entity position="0 2.5 -5">
          <a-text value="School Information" align="center" color="#FFF" width="6"></a-text>
          <a-text value="Turn around to see the school view." position="0 -0.6 0" align="center" color="#CCC" width="4"></a-text>
        </a-entity>

        <a-entity id="gallery-area" position="0 1.2 0">
          <a-image src="#thumb1" color="#FF00FF" position="-2.5 0 -4.3" rotation="0 30 0" width="1.5" height="1"></a-image>
          <a-image src="#thumb2" color="#00FF00" position="-1.2 0 -4.8" rotation="0 15 0" width="1.5" height="1"></a-image>
          <a-image src="#thumb3" color="#0000FF" position="0 0 -5" rotation="0 0 0" width="1.5" height="1"></a-image>
          <a-image src="#thumb4" color="#FFFF00" position="1.2 0 -4.8" rotation="0 -15 0" width="1.5" height="1"></a-image>
          <a-image src="#thumb5" color="#FF0000" position="2.5 0 -4.3" rotation="0 -30 0" width="1.5" height="1"></a-image>
        </a-entity>
      </a-entity>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
