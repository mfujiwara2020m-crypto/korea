<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>診断用テスト</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #FFFFFF">

      <a-sphere 
        color="#00FF00"
        radius="30" 
        phi-length="300"
        material="side: double; shader: flat; opacity: 0.5"
        scale="1 1 -1"
        rotation="0 30 0">
      </a-sphere>

      <a-entity id="test-column" rotation="0 180 0" position="0 1.6 -4">
        <a-plane color="red" width="2" height="1" position="0 2.4 0"></a-plane>
        <a-plane color="blue" width="2" height="1" position="0 1.2 0"></a-plane>
        <a-plane color="orange" width="2" height="1" position="0 0 0"></a-plane>
        <a-plane color="purple" width="2" height="1" position="0 -1.2 0"></a-plane>
        <a-plane color="black" width="2" height="1" position="0 -2.4 0"></a-plane>
      </a-entity>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
