<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>iPhone表示最終調整</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #FFFFFF" renderer="colorManagement: true; sortObjects: true;">

      <a-assets timeout="20000">
        <img id="main-bg" src="IMG_7689.jpeg" crossorigin="anonymous">
        <img id="t1" src="thumb1.png" crossorigin="anonymous">
        <img id="t2" src="thumb2.jpg" crossorigin="anonymous">
        <img id="t3" src="thumb3.jpg" crossorigin="anonymous">
        <img id="t5" src="thumb5.jpg" crossorigin="anonymous">
        <img id="t6" src="thumb6.jpg" crossorigin="anonymous">
        <img id="t7" src="thumb7.jpg" crossorigin="anonymous">
      </a-assets>

    <a-sphere 
  src="#main-bg" 
  radius="70" 
  phi-length="300"
  material="side: double; shader: flat"
  scale="1 1 -1"
  rotation="0 90 0"> 
</a-sphere>

<a-entity id="photo-column" rotation="0 210 0" position="0 1.6 0">
  <a-plane src="#t1" width="3" height="1.8" position="0 6 -5" material="shader: flat; side: double"></a-plane>
  <a-plane src="#t2" width="3" height="1.8" position="0 4 -5" material="shader: flat; side: double"></a-plane>
  <a-plane src="#t3" width="3" height="1.8" position="0 2 -5" material="shader: flat; side: double"></a-plane>
  <a-plane src="#t5" width="3" height="1.8" position="0 0 -5" material="shader: flat; side: double"></a-plane>
  <a-plane src="#t6" width="3" height="1.8" position="0 -2 -5" material="shader: flat; side: double"></a-plane>
  <a-plane src="#t7" width="3" height="1.8" position="0 -4 -5" material="shader: flat; side: double"></a-plane>
  
</a-entity>
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
